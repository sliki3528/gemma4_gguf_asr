[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gemma4-gguf-asr"
version = "0.1.1"
description = "Gemma 4 GGUF + mmproj WAV transcription via llama-cpp-python (libmtmd audio)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "gemma4-gguf-asr contributors" }]
keywords = ["gemma", "gguf", "asr", "speech", "llama-cpp", "mtmd"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "numpy>=1.24",
  "soundfile>=0.12",
  "llama-cpp-python>=0.3.20",
]

[project.optional-dependencies]
# 샘플레이트 불일치 시 torchaudio 리샘플 (미설치면 해당 구간만 스킵)
resample = ["torch", "torchaudio"]

[project.urls]
Homepage = "https://github.com/example/gemma4-gguf-asr"

[tool.setuptools.packages.find]
where = ["src"]
